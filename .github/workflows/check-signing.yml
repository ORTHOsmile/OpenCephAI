name: Check signing
# Proves the signing certificate and the notarisation key work, without building or uploading anything.
# No secret value is ever printed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Import the certificate into a temporary keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [ -z "${!v}" ]; then echo "FAIL: secret $v is empty or missing"; exit 1; fi
          done
          KC="$RUNNER_TEMP/check.keychain-db"; KCPW="$(openssl rand -hex 24)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          if ! security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" >/dev/null 2>&1; then
            echo "FAIL: the certificate could not be imported (wrong P12_PASSWORD, or the file is not a .p12)"; exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          IDS="$(security find-identity -v -p codesigning "$KC")"
          NAME="$(echo "$IDS" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$NAME" ]; then
            echo "FAIL: no 'Developer ID Application' signing identity found. Identities found:"
            echo "$IDS" | sed 's/^ *[0-9]*) [0-9A-F]* //'
            exit 1
          fi
          echo "PASS: certificate imported; signing identity: $NAME"
          echo "$NAME" | grep -o '([A-Z0-9]*)$' | tr -d '()' | sed 's/^/Team ID: /'
          security delete-keychain "$KC"
      - name: Check the notarisation key with Apple (no upload)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for v in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then echo "FAIL: secret $v is empty or missing"; exit 1; fi
          done
          K="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPLE_API_KEY" > "$K"; echo "Key stored as plain .p8 text"
          else
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$K" 2>/dev/null || true
            grep -q 'BEGIN PRIVATE KEY' "$K" || { echo "FAIL: APPLE_API_KEY is neither .p8 text nor base64 of a .p8"; exit 1; }
            echo "Key stored as base64 of the .p8"
          fi
          if xcrun notarytool history --key "$K" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > "$RUNNER_TEMP/h.json" 2> "$RUNNER_TEMP/h.err"; then
            echo "PASS: Apple accepted the notarisation key (past submissions: $(grep -o '"id"' "$RUNNER_TEMP/h.json" | wc -l | tr -d ' '))"
          else
            echo "FAIL: Apple refused the notarisation key. Apple said:"; sed 's/[A-Za-z0-9+\/=]\{40,\}/<redacted>/g' "$RUNNER_TEMP/h.err" | head -5
            exit 1
          fi
          rm -f "$K" "$RUNNER_TEMP/h.json" "$RUNNER_TEMP/h.err"
