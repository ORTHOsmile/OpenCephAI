[package]
name = "ceph-infer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cephalometric landmark inference: cv2-exact preprocessing, heatmap decoding, ONNX Runtime engine"

[dependencies]
ort = { version = "=2.0.0-rc.10", features = ["coreml"] }   # pinned exactly: the rc API shifts between releases
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
