[package]
name = "ceph-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CephTrace model catalogue and on-Mac conversion: safe PyTorch reader, weight-free skeletons, install checks"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
# raw_value (already on in the app build through Tauri): the starting-knowledge file reads each coordinate's literal
# text and parses it with Rust's correctly rounded `str::parse`, because serde_json's default f64 parser can miss by
# 1 ULP (seen on Task 3's round-trip test). float_roundtrip is NOT used: it would change every JSON number the app reads.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
