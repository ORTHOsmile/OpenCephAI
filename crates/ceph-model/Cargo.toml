[package]
name = "ceph-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CephTrace model catalogue and on-Mac conversion: safe PyTorch reader, weight-free skeletons, install checks"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
